name: SeltBot

on:
  schedule:
    - cron: "7 */3 * * *"   # safety-net fallback; the self-chain keeps 24/7 alive
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: seltbot-singleton
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 352
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "seltbot"
          git config user.email "actions@users.noreply.github.com"

      - name: Compute shift deadline
        id: deadline
        run: echo "ts=$(date -u -d '+345 minutes' +%s)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core dependencies
        run: pip install telethon aiohttp requests tzdata

      - name: Install optional dependencies (best effort)
        run: pip install qrcode pypng ddgs || echo "::warning::optional deps skipped (qr/web search degraded)"

      - name: Run SeltBot (shift ≈ 5h45m)
        id: bot
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          MANAGER_BOT_TOKEN: ${{ secrets.MANAGER_BOT_TOKEN }}
          NOTIFY_BOT_TOKEN: ${{ secrets.NOTIFY_BOT_TOKEN }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_DEADLINE: ${{ steps.deadline.outputs.ts }}
        run: |
          set +e
          timeout --signal=SIGTERM --kill-after=30 20670 python -u seltbot.py
          rc=$?
          set -e
          if [ "$rc" -eq 124 ]; then
            echo "::warning::hard timeout backstop hit (graceful exit missed)"
            exit 0
          fi
          exit $rc

      - name: Heartbeat (keeps repo active so cron stays enabled)
        if: always()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
          git add .heartbeat
          git commit -m "tick" || echo "nothing to commit"
          git push || echo "push skipped"

      - name: Chain next shift (24/7 continuity)
        if: always() && steps.bot.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/actions/workflows/seltbot.yml/dispatches" -f ref="${{ github.ref }}" || echo "chain failed — cron recovers"
